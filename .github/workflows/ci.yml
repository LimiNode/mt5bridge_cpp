name: Windows CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip "numpy==1.26.4"
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DPython3_EXECUTABLE="$env:pythonLocation\python.exe"
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  formal-dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build TLC from pinned upstream source
        shell: bash
        run: bash ./.github/scripts/build_tlc.sh
      - name: Check dispatch recovery model
        run: |
          pushd formal/dispatch
          java -cp ../../tla2tools.jar tlc2.TLC \
            -config dispatch_recovery.cfg \
            dispatch_recovery.tla
          popd

  formal-reconciliation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build TLC from pinned upstream source
        shell: bash
        run: bash ./.github/scripts/build_tlc.sh
      - name: Check reconciliation evidence model
        run: |
          pushd formal/reconciliation
          java -cp ../../tla2tools.jar tlc2.TLC \
            -config reconciliation_evidence.cfg \
            reconciliation_evidence.tla
          java -cp ../../tla2tools.jar tlc2.TLC \
            -config reconciliation_evidence_refresh.cfg \
            reconciliation_evidence.tla
          popd

  formal-managed-trade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build TLC from pinned upstream source
        shell: bash
        run: bash ./.github/scripts/build_tlc.sh
      - name: Check managed trade lifecycle model
        run: |
          pushd formal/managed_trade
          java -cp ../../tla2tools.jar tlc2.TLC \
            -config managed_trade_lifecycle.cfg \
            managed_trade_lifecycle.tla
          popd
