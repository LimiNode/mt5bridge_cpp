name: Windows CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip "numpy==1.26.4"
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DPython3_EXECUTABLE="$env:pythonLocation\python.exe"
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
